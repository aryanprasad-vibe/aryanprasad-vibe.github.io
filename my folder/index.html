<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- PASTE GOOGLE VERIFICATION TAG RIGHT BELOW THIS LINE LATER -->

  <title>Aryan Prasad</title>
  <meta name="description" content="Official photo and website of Aryan Prasad.">
  <meta name="keywords" content="Aryan Prasad, AryanPrasad">
  <meta name="author" content="Aryan Prasad">

  <!-- Open Graph for Social & Google Previews -->
  <meta property="og:title" content="Aryan Prasad">
  <meta property="og:image" content="https://aryanprasad.github.io/aryan-prasad.jpg">
  <meta property="og:url" content="https://aryanprasad.github.io/">
  <meta property="og:type" content="profile">

  <!-- Google Search Bot Secret Code (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Aryan Prasad",
    "url": "https://aryanprasad.github.io/",
    "image": "https://aryanprasad.github.io/aryan-prasad.jpg"
  }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', system-ui, sans-serif;
      background-color: #0b1528;
      position: relative;
    }

    /* Subtle photo color-match layer so the mountains & sky blend with your photo */
    .bg-tint {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      background-size: cover;
      background-position: center;
      filter: blur(70px) brightness(0.45) saturate(1.4);
      opacity: 0.45;
      z-index: 1;
      pointer-events: none;
      transition: filter 0.6s ease;
    }

    body.rage-active .bg-tint {
      filter: blur(70px) brightness(0.25) saturate(2.5) hue-rotate(-40deg);
    }

    /* Layer 2: Realistic Mountains, Drifting Clouds & Birds Canvas */
    #worldCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Layer 3: Steady Center Portrait seamlessly melted into the mountain mist */
    .showcase {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .photo-wrapper {
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 50px rgba(5, 15, 35, 0.75));
      transition: filter 0.4s ease;
    }

    body.rage-active .photo-wrapper {
      filter: drop-shadow(0 0 65px rgba(255, 0, 30, 0.8));
    }

    /* Soft feathered edges so the portrait melts into the mountain clouds */
    #mainPhoto {
      display: block;
      max-height: 75vh;
      max-width: 86vw;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 26px;
      -webkit-mask-image: 
        linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: 
        linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-composite: intersect;
    }

    h1 {
      margin-top: 14px;
      font-size: clamp(2rem, 3.8vw, 3.1rem);
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #f8fafc;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.95), 0 0 18px rgba(186, 230, 253, 0.4);
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    body.rage-active h1 {
      color: #fecdd3;
      text-shadow: 0 6px 25px #000, 0 0 35px #ff0022;
    }

    /* Layer 4: Chinese Golden Dragon Canvas */
    #dragonCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    /* Layer 5: 5-Click Rage Overlay */
    .rage-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5vh 20px;
      opacity: 0;
      transition: opacity 0.35s ease;
      background: radial-gradient(circle, transparent 45%, rgba(130, 0, 15, 0.6) 100%);
    }

    body.rage-active .rage-overlay {
      opacity: 1;
    }

    .go-away-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.2rem, 8.5vw, 6.5rem);
      font-weight: 900;
      letter-spacing: 12px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 
        0 0 15px #ff0022,
        0 0 35px #ff0022,
        0 0 75px #dc2626,
        0 10px 30px #000000;
      animation: rageShake 0.12s infinite alternate;
    }

    .calm-hint {
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 210, 210, 0.9);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 20, 40, 0.5);
    }

    @keyframes rageShake {
      0% { transform: translate(-2px, 1px) scale(1); }
      100% { transform: translate(2px, -2px) scale(1.02); }
    }
  </style>
</head>
<body>

  <div class="bg-tint" id="bgTint"></div>
  <canvas id="worldCanvas"></canvas>

  <div class="showcase">
    <div class="photo-wrapper" id="photoTrigger">
      <img id="mainPhoto" src="aryan-prasad.jpg" alt="Aryan Prasad" title="Aryan Prasad">
    </div>
    <h1>Aryan Prasad</h1>
  </div>

  <canvas id="dragonCanvas"></canvas>

  <div class="rage-overlay">
    <div class="go-away-text">GO AWAY!</div>
    <div class="calm-hint">Click photo to calm the dragon</div>
  </div>

  <script>
    // ====================================================
    // 1. SMART PHOTO LOADER
    // ====================================================
    const possibleNames = [
      'aryan-prasad.jpg', 'aryan prasad.jpg',
      'aryan-prasad.jpeg', 'aryan prasad.jpeg',
      'aryan-prasad.png', 'aryan prasad.png',
      'aryan-prasad.jpg.jpg', 'aryan prasad.jpg.jpg',
      'aryan-prasad.webp', 'aryan prasad.webp'
    ];
    const mainPhoto = document.getElementById('mainPhoto');
    const bgTint = document.getElementById('bgTint');

    (function loadPhoto(i) {
      if (i >= possibleNames.length) return;
      const img = new Image();
      img.onload = () => {
        mainPhoto.src = possibleNames[i];
        bgTint.style.backgroundImage = `url("${possibleNames[i]}")`;
      };
      img.onerror = () => loadPhoto(i + 1);
      img.src = possibleNames[i];
    })(0);

    // ====================================================
    // 2. 5-CLICK RAGE MODE TRIGGER
    // ====================================================
    let clickCount = 0;
    let isRageMode = false;
    const photoTrigger = document.getElementById('photoTrigger');
    const clickRipples = [];

    photoTrigger.addEventListener('click', (e) => {
      if (isRageMode) {
        isRageMode = false;
        clickCount = 0;
        document.body.classList.remove('rage-active');
        return;
      }
      clickCount++;
      clickRipples.push({ x: e.clientX, y: e.clientY, r: 6, alpha: 1 });
      if (clickCount >= 5) {
        isRageMode = true;
        document.body.classList.add('rage-active');
      }
    });

    // ====================================================
    // 3. REALISTIC MOUNTAINS, VOLUMETRIC CLOUDS & BIRDS
    // ====================================================
    const worldCanvas = document.getElementById('worldCanvas');
    const wCtx = worldCanvas.getContext('2d');
    const dragonCanvas = document.getElementById('dragonCanvas');
    const dCtx = dragonCanvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;

    // Generate 3 realistic jagged mountain ranges (far, mid, near)
    let mountainLayers = [];
    function generateMountains() {
      mountainLayers = [
        { baseHeight: H * 0.42, amp: H * 0.22, detail: 140, colorTop: '#334e68', colorBot: '#102a43', snow: true, seed: 1.2 },
        { baseHeight: H * 0.56, amp: H * 0.19, detail: 110, colorTop: '#1e3a5f', colorBot: '#0a192f', snow: false, seed: 3.7 },
        { baseHeight: H * 0.70, amp: H * 0.15, detail: 90,  colorTop: '#132a3e', colorBot: '#060d18', snow: false, seed: 7.4 }
      ].map(layer => {
        const pts = [];
        const steps = 90;
        for (let i = 0; i <= steps; i++) {
          const x = (i / steps) * W;
          const nx = i * 0.15 + layer.seed;
          // Multi-octave ridge formula for realistic peaks
          const ridge =
            Math.abs(Math.sin(nx) * 0.55 + Math.cos(nx * 2.3) * 0.28 + Math.sin(nx * 5.1) * 0.12 + Math.cos(nx * 11.3) * 0.05);
          const y = layer.baseHeight - ridge * layer.amp;
          pts.push({ x, y, ridge });
        }
        return { ...layer, pts };
      });
    }

    // Generate realistic multi-puff volumetric clouds
    const clouds = Array.from({ length: 14 }, (_, i) => ({
      x: Math.random() * W,
      y: Math.random() * (H * 0.62) + H * 0.04,
      speed: (Math.random() * 0.22 + 0.08) * (i % 2 === 0 ? 1 : 0.7),
      scale: Math.random() * 0.9 + 0.65,
      opacity: Math.random() * 0.26 + 0.14,
      puffs: [
        { dx: 0, dy: 0, r: 58 },
        { dx: -45, dy: 12, r: 44 },
        { dx: 48, dy: 10, r: 46 },
        { dx: -80, dy: 22, r: 34 },
        { dx: 82, dy: 20, r: 36 },
        { dx: 18, dy: -18, r: 42 }
      ]
    }));

    // Stylized animated birds soaring across the mountain valleys
    const birds = Array.from({ length: 15 }, () => ({
      x: Math.random() * W,
      y: Math.random() * (H * 0.55) + 40,
      vx: Math.random() * 1.1 + 0.7,
      vy: (Math.random() - 0.5) * 0.2,
      size: Math.random() * 7 + 5,
      phase: Math.random() * Math.PI * 2,
      flapSpeed: Math.random() * 0.07 + 0.08
    }));

    function resizeAll() {
      W = worldCanvas.width = dragonCanvas.width = window.innerWidth;
      H = worldCanvas.height = dragonCanvas.height = window.innerHeight;
      generateMountains();
    }
    window.addEventListener('resize', resizeAll);
    resizeAll();

    function drawSingleCloud(ctx, c) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.scale, c.scale * 0.62);
      c.puffs.forEach(p => {
        const grad = ctx.createRadialGradient(p.dx, p.dy - p.r * 0.25, p.r * 0.1, p.dx, p.dy, p.r);
        if (isRageMode) {
          grad.addColorStop(0, `rgba(255, 150, 150, ${c.opacity * 1.1})`);
          grad.addColorStop(0.5, `rgba(140, 20, 30, ${c.opacity * 0.8})`);
          grad.addColorStop(1, 'rgba(60, 0, 10, 0)');
        } else {
          grad.addColorStop(0, `rgba(248, 250, 252, ${c.opacity * 1.3})`);
          grad.addColorStop(0.55, `rgba(186, 214, 235, ${c.opacity * 0.85})`);
          grad.addColorStop(1, 'rgba(148, 184, 215, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.dx, p.dy, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawMountainsAndSky() {
      wCtx.clearRect(0, 0, W, H);

      // 1. Atmospheric Sky Gradient (Matches lakeside mountain daylight/dusk)
      const skyGrad = wCtx.createLinearGradient(0, 0, 0, H);
      if (isRageMode) {
        skyGrad.addColorStop(0, '#1a0308');
        skyGrad.addColorStop(0.5, '#3b0712');
        skyGrad.addColorStop(1, '#090204');
      } else {
        skyGrad.addColorStop(0, '#1e3a5f');
        skyGrad.addColorStop(0.42, '#4a7c9b');
        skyGrad.addColorStop(0.75, '#1b3548');
        skyGrad.addColorStop(1, '#07111e');
      }
      wCtx.fillStyle = skyGrad;
      wCtx.fillRect(0, 0, W, H);

      // 2. High Altitude Clouds (Behind distant peaks)
      for (let i = 0; i < 6; i++) {
        const c = clouds[i];
        c.x += isRageMode ? c.speed * 3 : c.speed;
        if (c.x - 160 > W) c.x = -160;
        drawSingleCloud(wCtx, c);
      }

      // 3. Draw Realistic Layered Mountain Ranges + Valley Mist
      mountainLayers.forEach((layer, idx) => {
        const mGrad = wCtx.createLinearGradient(0, layer.baseHeight - layer.amp, 0, H);
        if (isRageMode) {
          mGrad.addColorStop(0, idx === 0 ? '#5c121e' : '#380811');
          mGrad.addColorStop(1, '#080103');
        } else {
          mGrad.addColorStop(0, layer.colorTop);
          mGrad.addColorStop(1, layer.colorBot);
        }

        wCtx.beginPath();
        wCtx.moveTo(0, H);
        layer.pts.forEach(p => wCtx.lineTo(p.x, p.y));
        wCtx.lineTo(W, H);
        wCtx.closePath();
        wCtx.fillStyle = mGrad;
        wCtx.fill();

        // Sunlit/Snowy Ridge Highlights on the farthest tall mountain range
        if (layer.snow) {
          wCtx.save();
          wCtx.strokeStyle = isRageMode ? 'rgba(255, 80, 80, 0.45)' : 'rgba(226, 240, 252, 0.45)';
          wCtx.lineWidth = 2.2;
          wCtx.beginPath();
          layer.pts.forEach((p, i) => {
            if (i === 0) wCtx.moveTo(p.x, p.y);
            else wCtx.lineTo(p.x, p.y);
          });
          wCtx.stroke();

          // Shaded mountain facets (3D ridge shadow lines)
          layer.pts.forEach((p, i) => {
            if (i % 4 === 0 && i > 0 && i < layer.pts.length - 1) {
              wCtx.beginPath();
              wCtx.moveTo(p.x, p.y);
              wCtx.lineTo(p.x + 28, p.y + 85);
              wCtx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
              wCtx.lineWidth = 8;
              wCtx.stroke();
            }
          });
          wCtx.restore();
        }

        // Soft valley mist between mountain layers
        const mistGrad = wCtx.createLinearGradient(0, layer.baseHeight - 30, 0, layer.baseHeight + 90);
        mistGrad.addColorStop(0, 'rgba(186, 220, 245, 0)');
        mistGrad.addColorStop(0.5, isRageMode ? 'rgba(180, 20, 35, 0.16)' : 'rgba(186, 220, 245, 0.15)');
        mistGrad.addColorStop(1, 'rgba(186, 220, 245, 0)');
        wCtx.fillStyle = mistGrad;
        wCtx.fillRect(0, layer.baseHeight - 30, W, 120);
      });

      // 4. Low Drifting Valley Clouds (In front of mountains, melting into photo edges)
      for (let i = 6; i < clouds.length; i++) {
        const c = clouds[i];
        c.x += isRageMode ? c.speed * 3 : c.speed;
        if (c.x - 160 > W) c.x = -160;
        drawSingleCloud(wCtx, c);
      }

      // 5. Stylized Animated Birds
      birds.forEach(b => {
        b.x += isRageMode ? b.vx * 2.5 : b.vx;
        b.y += b.vy + Math.sin(b.phase * 0.5) * 0.25;
        b.phase += isRageMode ? b.flapSpeed * 2 : b.flapSpeed;

        if (b.x > W + 40) {
          b.x = -40;
          b.y = Math.random() * (H * 0.52) + 40;
        }

        const wingTipY = Math.sin(b.phase) * b.size * 0.75;
        wCtx.save();
        wCtx.translate(b.x, b.y);
        wCtx.strokeStyle = isRageMode ? '#fca5a5' : '#e2e8f0';
        wCtx.lineWidth = 1.9;
        wCtx.lineCap = 'round';
        wCtx.beginPath();
        wCtx.moveTo(-b.size, wingTipY);
        wCtx.quadraticCurveTo(-b.size * 0.4, -b.size * 0.38, 0, 0);
        wCtx.quadraticCurveTo(b.size * 0.4, -b.size * 0.38, b.size, wingTipY);
        wCtx.stroke();
        wCtx.restore();
      });
    }

    // ====================================================
    // 4. TRUE CHINESE GOLDEN DRAGON (RIBBON BODY + SMART AI)
    // ====================================================
    const NUM_JOINTS = 85;
    const JOINT_SPACING = 6.5;

    // Dragon state: starts in upper left sky
    const dragon = {
      x: W * 0.15,
      y: H * 0.2,
      angle: 0.2,
      speed: 2.35,         // Calm, majestic cruising speed
      maxTurnRate: 0.026,  // Smooth wide turning radius (never jerks!)
      wanderAngle: 0,
      waveTime: 0
    };

    const joints = Array.from({ length: NUM_JOINTS }, (_, i) => ({
      x: dragon.x - i * JOINT_SPACING,
      y: dragon.y,
      angle: 0
    }));

    // Track cursor for slow, planned pursuit
    const mouse = { x: W * 0.8, y: H * 0.25, lastMove: 0 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.lastMove = performance.now();
    });

    // Random sky waypoint when cursor is idle
    let patrolTarget = { x: W * 0.82, y: H * 0.22 };
    function pickNewPatrolPoint() {
      const rect = mainPhoto.getBoundingClientRect();
      // Pick points in the sky/mountains around the photo
      for (let tries = 0; tries < 10; tries++) {
        const px = Math.random() * (W - 160) + 80;
        const py = Math.random() * (H - 160) + 80;
        const insidePhoto =
          px > rect.left - 40 && px < rect.right + 40 &&
          py > rect.top - 40 && py < rect.bottom + 40;
        if (!insidePhoto) {
          patrolTarget = { x: px, y: py };
          return;
        }
      }
    }
    setInterval(pickNewPatrolPoint, 4200);

    // Normalize angle difference to [-PI, PI]
    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function updateDragonPhysics() {
      if (isRageMode) {
        // Freeze position in Rage Mode, only vibrate menacingly
        dragon.waveTime += 0.14;
        return;
      }

      dragon.waveTime += 0.065;
      const now = performance.now();
      const rect = mainPhoto.getBoundingClientRect();
      const photoCX = (rect.left + rect.right) / 2;
      const photoCY = (rect.top + rect.bottom) / 2;
      const avoidRadiusX = (rect.width / 2) + 65;
      const avoidRadiusY = (rect.height / 2) + 55;

      // 1. Choose Planned Goal: Follow cursor slowly if moved in last 8 seconds, else unpredictable sky patrol
      let goalX = (now - mouse.lastMove < 8000) ? mouse.x : patrolTarget.x;
      let goalY = (now - mouse.lastMove < 8000) ? mouse.y : patrolTarget.y;

      // If cursor is right on top of the photo, project the dragon's planned target to the nearest edge outside the photo
      const gdx = (goalX - photoCX) / avoidRadiusX;
      const gdy = (goalY - photoCY) / avoidRadiusY;
      const gDistSq = gdx * gdx + gdy * gdy;
      if (gDistSq < 0.85) {
        const pushAngle = Math.atan2(gdy, gdx);
        goalX = photoCX + Math.cos(pushAngle) * avoidRadiusX * 1.05;
        goalY = photoCY + Math.sin(pushAngle) * avoidRadiusY * 1.05;
      }

      // 2. Calculate Desired Steering Vector
      let steerX = goalX - dragon.x;
      let steerY = goalY - dragon.y;
      const distToGoal = Math.hypot(steerX, steerY) || 1;
      steerX /= distToGoal;
      steerY /= distToGoal;

      // If close to patrol target, pick a new unpredictable one
      if (distToGoal < 90 && (now - mouse.lastMove >= 8000)) {
        pickNewPatrolPoint();
      }

      // 3. Unpredictable Serpentine Wander Force (so it never flies in robotic straight lines)
      dragon.wanderAngle += (Math.random() - 0.5) * 0.25;
      steerX += Math.cos(dragon.angle + Math.sin(dragon.waveTime * 0.5) * 1.1) * 0.55;
      steerY += Math.sin(dragon.angle + Math.sin(dragon.waveTime * 0.5) * 1.1) * 0.55;

      // 4. Photo Avoidance Field (Smoothly banks around the photo ~88% of the time)
      const lookAheadX = dragon.x + Math.cos(dragon.angle) * 95;
      const lookAheadY = dragon.y + Math.sin(dragon.angle) * 95;
      const ndx = (lookAheadX - photoCX) / avoidRadiusX;
      const ndy = (lookAheadY - photoCY) / avoidRadiusY;
      const normDist = Math.hypot(ndx, ndy);

      if (normDist < 1.18) {
        // Tangential + outward deflection so the dragon gracefully curves AROUND the portrait frame
        const repelStrength = Math.pow((1.18 - normDist) / 1.18, 1.5) * 2.9;
        const awayAngle = Math.atan2(ndy, ndx);
        // Pick tangent direction closest to current heading
        const tangent1 = awayAngle + Math.PI * 0.42;
        const tangent2 = awayAngle - Math.PI * 0.42;
        const bestAvoidAngle =
          Math.abs(normalizeAngle(tangent1 - dragon.angle)) < Math.abs(normalizeAngle(tangent2 - dragon.angle))
            ? tangent1
            : tangent2;

        steerX += Math.cos(bestAvoidAngle) * repelStrength;
        steerY += Math.sin(bestAvoidAngle) * repelStrength;
      }

      // 5. Screen Boundary Soft Turn-Back (Keep dragon comfortably on screen)
      const margin = 75;
      if (dragon.x < margin) steerX += 2.2;
      if (dragon.x > W - margin) steerX -= 2.2;
      if (dragon.y < margin) steerY += 2.2;
      if (dragon.y > H - margin) steerY -= 2.2;

      // 6. Apply Smooth Planned Turn Rate Limit
      const desiredAngle = Math.atan2(steerY, steerX);
      const angleDiff = normalizeAngle(desiredAngle - dragon.angle);
      dragon.angle += Math.max(-dragon.maxTurnRate, Math.min(dragon.maxTurnRate, angleDiff * 0.08));

      // Add subtle natural head slither wave
      const slitherHeading = dragon.angle + Math.sin(dragon.waveTime) * 0.14;
      dragon.x += Math.cos(slitherHeading) * dragon.speed;
      dragon.y += Math.sin(slitherHeading) * dragon.speed;

      // 7. Update Spine Joints with Travelling S-Curve Wave
      joints[0].x = dragon.x;
      joints[0].y = dragon.y;
      joints[0].angle = slitherHeading;

      for (let i = 1; i < NUM_JOINTS; i++) {
        const prev = joints[i - 1];
        const cur = joints[i];
        const dx = prev.x - cur.x;
        const dy = prev.y - cur.y;
        let segAngle = Math.atan2(dy, dx);

        // Add subtle organic S-wave propagation down the body
        const waveOffset = Math.sin(dragon.waveTime - i * 0.16) * 0.018 * Math.min(1, i / 12);
        segAngle += waveOffset;

        cur.angle = segAngle;
        cur.x = prev.x - Math.cos(segAngle) * JOINT_SPACING;
        cur.y = prev.y - Math.sin(segAngle) * JOINT_SPACING;
      }
    }

    // Body half-width profile (sculpted neck, muscular chest, long tapering tail)
    function getBodyRadius(i) {
      const t = i / (NUM_JOINTS - 1);
      if (t < 0.08) return 9 + (t / 0.08) * 5; // Sleek neck behind head
      return Math.pow(1 - (t - 0.08) / 0.92, 0.75) * 14 + 2.2;
    }

    // Draw Traditional Muscular Chinese Dragon Leg & 4 Sharp Golden Claws
    function drawTraditionalLeg(ctx, joint, side, scale) {
      ctx.save();
      ctx.translate(joint.x, joint.y);
      ctx.rotate(joint.angle);

      const stride = Math.sin(dragon.waveTime * 0.7 + side) * 0.14;
      ctx.scale(1, side); // Mirror for left/right side of body
      ctx.rotate(stride);

      // Muscular Shoulder & Forearm Curve
      const legGrad = ctx.createLinearGradient(0, 0, -20 * scale, 38 * scale);
      legGrad.addColorStop(0, '#d97706');
      legGrad.addColorStop(0.6, '#fbbf24');
      legGrad.addColorStop(1, '#fef08a');

      ctx.fillStyle = legGrad;
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 1.4;

      ctx.beginPath();
      ctx.moveTo(6 * scale, 4 * scale);
      ctx.quadraticCurveTo(14 * scale, 18 * scale, 2 * scale, 26 * scale); // Elbow
      ctx.lineTo(-14 * scale, 34 * scale); // Wrist
      ctx.lineTo(-18 * scale, 28 * scale);
      ctx.quadraticCurveTo(-2 * scale, 18 * scale, -6 * scale, 4 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Golden Flame Tuft at Elbow
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.moveTo(6 * scale, 22 * scale);
      ctx.quadraticCurveTo(16 * scale, 26 * scale, 19 * scale, 20 * scale);
      ctx.quadraticCurveTo(12 * scale, 18 * scale, 6 * scale, 16 * scale);
      ctx.fill();

      // 4 Curved Eagle-like Dragon Talons
      ctx.translate(-16 * scale, 31 * scale);
      const clawAngles = [-0.6, -0.15, 0.3, 0.85];
      clawAngles.forEach(ca => {
        ctx.save();
        ctx.rotate(ca);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-6 * scale, 6 * scale, -11 * scale, 13 * scale);
        ctx.quadraticCurveTo(-3 * scale, 8 * scale, 2 * scale, 2 * scale);
        ctx.fillStyle = '#fef9c3';
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      });

      ctx.restore();
    }

    // Draw Ornate Feathered Flame Tail Plume
    function drawTailPlume(ctx, tailJoint) {
      ctx.save();
      ctx.translate(tailJoint.x, tailJoint.y);
      ctx.rotate(tailJoint.angle + Math.PI);

      const plumes = [-0.45, -0.22, 0, 0.22, 0.45];
      plumes.forEach((ang, idx) => {
        ctx.save();
        ctx.rotate(ang + Math.sin(dragon.waveTime + idx) * 0.08);
        const len = idx === 2 ? 42 : (idx === 1 || idx === 3 ? 34 : 25);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(len * 0.4, -6, len * 0.75, 6, len, 0);
        ctx.bezierCurveTo(len * 0.7, 9, len * 0.35, 4, 0, 0);
        ctx.fillStyle = idx % 2 === 0 ? '#fde047' : '#f59e0b';
        ctx.fill();
        ctx.strokeStyle = '#92400e';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      });
      ctx.restore();
    }

    // Draw Sculpted Imperial Chinese Dragon Head
    function drawDragonHead(ctx, head, rage) {
      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(head.angle);

      if (rage) {
        ctx.translate((Math.random() - 0.5) * 3.5, (Math.random() - 0.5) * 3.5);
      }

      // 1. Long Flowing Silk Whiskers
      ctx.strokeStyle = rage ? '#ff4d4d' : '#fef08a';
      ctx.lineWidth = 2.2;
      [-1, 1].forEach(side => {
        const wWave = Math.sin(dragon.waveTime * 1.4 + side) * 9;
        ctx.beginPath();
        ctx.moveTo(20, side * 8);
        ctx.bezierCurveTo(38, side * (26 + wWave), 8, side * (48 - wWave), -26, side * 38);
        ctx.stroke();
      });

      // 2. Branched Imperial Stag Horns
      ctx.strokeStyle = '#d97706';
      ctx.fillStyle = '#fde047';
      [-1, 1].forEach(side => {
        ctx.beginPath();
        ctx.moveTo(-4, side * 9);
        ctx.quadraticCurveTo(-22, side * 24, -42, side * 20);
        ctx.quadraticCurveTo(-24, side * 16, -8, side * 6);
        ctx.fill();
        ctx.stroke();

        // Secondary horn tine
        ctx.beginPath();
        ctx.moveTo(-18, side * 17);
        ctx.quadraticCurveTo(-26, side * 29, -34, side * 28);
        ctx.lineWidth = 2.5;
        ctx.stroke();
      });

      // 3. Sweeping Golden Flame Mane Around Jaw
      for (let m = -5; m <= 5; m++) {
        if (m === 0) continue;
        ctx.beginPath();
        ctx.moveTo(-6, m * 2.8);
        ctx.quadraticCurveTo(-22, m * 6.5, -34, m * 4.8);
        ctx.quadraticCurveTo(-20, m * 3.2, -10, m * 1.8);
        ctx.fillStyle = Math.abs(m) % 2 === 0 ? '#fde047' : '#d97706';
        ctx.fill();
      }

      // 4. Sculpted Dragon Skull, Flared Snout & Jaws
      const headGrad = ctx.createLinearGradient(-18, 0, 30, 0);
      headGrad.addColorStop(0, '#b45309');
      headGrad.addColorStop(0.45, '#f59e0b');
      headGrad.addColorStop(0.85, '#fbbf24');
      headGrad.addColorStop(1, '#fef08a');

      ctx.fillStyle = headGrad;
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 1.6;

      ctx.beginPath();
      ctx.moveTo(30, 0); // Upper snout flare
      ctx.bezierCurveTo(28, -9, 18, -11, 10, -9);
      ctx.quadraticCurveTo(2, -16, -10, -14); // Brow ridge
      ctx.quadraticCurveTo(-20, -9, -16, 0);
      ctx.quadraticCurveTo(-20, 9, -10, 14);  // Lower brow ridge
      ctx.quadraticCurveTo(2, 16, 10, 9);
      ctx.bezierCurveTo(18, 11, 28, 9, 30, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Golden Nasal Bridge Scales & Nostrils
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 1.2;
      for (let s = 4; s <= 20; s += 5) {
        ctx.beginPath();
        ctx.arc(s, 0, 3.5, -Math.PI * 0.4, Math.PI * 0.4);
        ctx.stroke();
      }
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.arc(23, -4, 1.7, 0, Math.PI * 2);
      ctx.arc(23, 4, 1.7, 0, Math.PI * 2);
      ctx.fill();

      // 5. DRAGON EYES (Golden normally -> BLAZING RED IN RAGE MODE)
      [-1, 1].forEach(side => {
        ctx.save();
        ctx.translate(2, side * 8.5);

        if (rage) {
          ctx.shadowBlur = 30;
          ctx.shadowColor = '#ff0000';
          ctx.fillStyle = '#ff0018';
          ctx.beginPath();
          ctx.ellipse(0, 0, 6.5, 4, side * 0.22, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(0, 0, 3, 1.4, side * 0.22, 0, Math.PI * 2);
          ctx.fill();

          // Fierce crimson eye flare
          ctx.strokeStyle = 'rgba(255, 25, 45, 0.95)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-18, 0); ctx.lineTo(18, 0);
          ctx.moveTo(0, -14); ctx.lineTo(0, 14);
          ctx.stroke();
        } else {
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#fde047';
          ctx.fillStyle = '#fef9c3';
          ctx.beginPath();
          ctx.ellipse(0, 0, 4.5, 2.7, side * 0.22, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#78350f';
          ctx.beginPath();
          ctx.arc(1, 0, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      ctx.restore();
    }

    function renderDragon() {
      dCtx.clearRect(0, 0, W, H);

      // Draw click ripples on photo
      for (let i = clickRipples.length - 1; i >= 0; i--) {
        const r = clickRipples[i];
        r.r += 4;
        r.alpha -= 0.04;
        if (r.alpha <= 0) {
          clickRipples.splice(i, 1);
          continue;
        }
        dCtx.beginPath();
        dCtx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        dCtx.strokeStyle = `rgba(251, 191, 36, ${r.alpha})`;
        dCtx.lineWidth = 2.5;
        dCtx.stroke();
      }

      // Compute Left and Right Ribbon Edges for a Continuous Smooth Serpentine Body (NO BUG CIRCLES!)
      const leftEdge = [];
      const rightEdge = [];
      const ridgePoints = [];

      for (let i = 0; i < NUM_JOINTS; i++) {
        const j = joints[i];
        const r = getBodyRadius(i);
        const nx = -Math.sin(j.angle);
        const ny = Math.cos(j.angle);

        const jitterX = isRageMode ? (Math.random() - 0.5) * 2.2 : 0;
        const jitterY = isRageMode ? (Math.random() - 0.5) * 2.2 : 0;

        leftEdge.push({ x: j.x + nx * r + jitterX, y: j.y + ny * r + jitterY });
        rightEdge.push({ x: j.x - nx * r + jitterX, y: j.y - ny * r + jitterY });
        ridgePoints.push({ x: j.x + jitterX, y: j.y + jitterY, r, angle: j.angle });
      }

      // 1. Draw Front & Rear Dragon Legs Underneath the Continuous Body Ribbon
      drawTraditionalLeg(dCtx, joints[16], -1, 1.05);
      drawTraditionalLeg(dCtx, joints[16], 1, 1.05);
      drawTraditionalLeg(dCtx, joints[48], -1, 0.88);
      drawTraditionalLeg(dCtx, joints[48], 1, 0.88);

      // 2. Draw Tail Plume at the tip
      drawTailPlume(dCtx, joints[NUM_JOINTS - 1]);

      // 3. Draw Continuous Smooth Serpentine Dragon Body Ribbon
      dCtx.save();
      dCtx.shadowBlur = isRageMode ? 28 : 16;
      dCtx.shadowColor = isRageMode ? 'rgba(255, 0, 30, 0.8)' : 'rgba(245, 158, 11, 0.45)';

      dCtx.beginPath();
      dCtx.moveTo(leftEdge[0].x, leftEdge[0].y);
      for (let i = 1; i < NUM_JOINTS; i++) {
        dCtx.lineTo(leftEdge[i].x, leftEdge[i].y);
      }
      for (let i = NUM_JOINTS - 1; i >= 0; i--) {
        dCtx.lineTo(rightEdge[i].x, rightEdge[i].y);
      }
      dCtx.closePath();

      const bodyGrad = dCtx.createLinearGradient(
        joints[0].x, joints[0].y,
        joints[NUM_JOINTS - 1].x, joints[NUM_JOINTS - 1].y
      );
      bodyGrad.addColorStop(0, '#fef08a');
      bodyGrad.addColorStop(0.35, '#fbbf24');
      bodyGrad.addColorStop(0.75, '#d97706');
      bodyGrad.addColorStop(1, '#92400e');

      dCtx.fillStyle = bodyGrad;
      dCtx.fill();

      // Deep Imperial Gold-Bronze Body Contour
      dCtx.strokeStyle = isRageMode ? '#991b1b' : '#78350f';
      dCtx.lineWidth = 2;
      dCtx.stroke();
      dCtx.restore();

      // 4. Draw Overlapping Woven Dragon Scale Pattern Along the Continuous Ribbon
      dCtx.save();
      dCtx.strokeStyle = 'rgba(120, 53, 15, 0.65)';
      dCtx.lineWidth = 1.15;

      for (let i = 2; i < NUM_JOINTS - 4; i += 2) {
        const p = ridgePoints[i];
        dCtx.save();
        dCtx.translate(p.x, p.y);
        dCtx.rotate(p.angle);

        // Center row & side rows of overlapping crescent dragon scales
        const scaleR = p.r * 0.42;
        [-p.r * 0.42, 0, p.r * 0.42].forEach((offsetY, rowIdx) => {
          const shiftX = rowIdx === 1 ? 0 : -scaleR * 0.6;
          dCtx.beginPath();
          dCtx.arc(shiftX, offsetY, scaleR, Math.PI * 0.55, Math.PI * 1.45);
          dCtx.stroke();
        });
        ctx_fin: {
          // Flowing Golden Dorsal Spine Fin along the center ridge
          if (i % 4 === 0) {
            dCtx.beginPath();
            dCtx.moveTo(4, 0);
            dCtx.quadraticCurveTo(-6, -p.r * 0.95, -14, -p.r * 0.35);
            dCtx.strokeStyle = isRageMode ? '#ff2a2a' : '#fef9c3';
            dCtx.lineWidth = 2.2;
            dCtx.stroke();
          }
        }
        dCtx.restore();
      }
      dCtx.restore();

      // 5. Draw Dragon Head Last so it sits majestically on top
      drawDragonHead(dCtx, joints[0], isRageMode);
    }

    function animateLoop() {
      drawMountainsAndSky();
      updateDragonPhysics();
      renderDragon();
      requestAnimationFrame(animateLoop);
    }
    animateLoop();
  </script>
